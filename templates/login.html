{% extends "base.html" %}

{% block title %}Login - Smart Shopping Cart{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header text-center">
                <h3><i class="fas fa-sign-in-alt"></i> Login</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username_or_email" class="form-label">Username atau Email</label>
                        <input type="text" class="form-control" id="username_or_email" name="username_or_email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>
                
                <div class="text-center mt-3">
                    <p>Belum punya akun? <a href="{{ url_for('register') }}">Daftar di sini</a></p>
                    <small class="text-muted">
                        Demo: Admin (admin/admin123) | User (user/user123)
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
